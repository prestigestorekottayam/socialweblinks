<!DOCTYPE html>
<html lang="en-IN" translate="no" class="notranslate">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Prestige Xclusive Kanjikuzhi - Connect with us via WhatsApp, Instagram, Facebook, YouTube, and download our contact vCard.">
    <meta name="keywords" content="Prestige Xclusive, Kanjikuzhi, WhatsApp, Instagram, Facebook, YouTube, vCard, contact, shopping">
    <meta name="author" content="Prestige Xclusive">
    <meta name="theme-color" content="#821e68">
    <meta name="google" content="notranslate">
    <meta property="og:site_name" content="Prestige Xclusive">
    <meta property="og:title" content="Prestige Xclusive - Kanjikuzhi">
    <meta property="og:description" content="Prestige Xclusive Kanjikuzhi | Connect with us on WhatsApp, Instagram, Facebook & YouTube. Shop & Save Contacts!">
    <meta property="og:type" content="website">
    <meta property="og:image" content="images/logo.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:locale" content="en_IN">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Prestige Xclusive - Kanjikuzhi">
    <meta name="twitter:description" content="Prestige Xclusive Kanjikuzhi | Shop, Connect & Download Contact. Join our WhatsApp Community!">
    <meta name="twitter:image" content="images/logo.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Prestige Xclusive</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="favicon.svg">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header>
        <div class="logo">
            <img src="images/logo.png" alt="Prestige Xclusive" class="brand-logo">
            <p class="branch-name">K A N J I K U Z H I</p>
        </div>
    </header>
    <main>
        <div class="links">
            <a href="tel:+919876543210" class="link phone">
                <i class="fas fa-phone icon"></i>
                <span class="text">Call Us</span>
            </a> 
            <a href="prestige-kanjikuzhi-contact.vcf" class="link contact" id="save-contact">
                <i class="fas fa-address-book icon"></i>
                <span class="text">Add to Contacts</span>
            </a>
            <div class="android-contact-note" id="android-contact-note" role="status" hidden>
                <p>If asked, tap Open. Choose Contacts and save it. If you miss the prompt, open your browser menu &gt; Downloads and tap prestige-kanjikuzhi-contact.vcf.</p>
                <button type="button" class="note-close" id="android-contact-note-close" aria-label="Close contact instructions">Close</button>
            </div>
            <a href="https://chat.whatsapp.com/Bkd8iHkeJa56kLOjX7maqt" class="link wa" target="_blank" rel="noreferrer noopener">
                <i class="fab fa-whatsapp icon"></i>
                <span class="text">WhatsApp Community</span>
            </a>
            <a href="https://www.instagram.com/prestige_kanjikuzhi/" class="link ig" target="_blank" rel="noreferrer noopener">
                <i class="fab fa-instagram icon"></i>
                <span class="text">Instagram</span>
            </a>
            <a href="https://www.facebook.com/349462188249045" class="link fb" target="_blank" rel="noreferrer noopener">
                <i class="fab fa-facebook-f icon"></i>
                <span class="text">Facebook</span>
            </a>
            <a href="https://www.youtube.com/@prestigexclusive-kanjikuzhy" class="link yt" target="_blank" rel="noreferrer noopener">
                <i class="fab fa-youtube icon"></i>
                <span class="text">YouTube</span>
            </a>
        </div>
    </main>
    <footer>
    </footer>
    <script>
        const isAndroid = /Android/i.test(navigator.userAgent);
        const contactLink = document.getElementById('save-contact');
        const contactNote = document.getElementById('android-contact-note');
        const contactNoteClose = document.getElementById('android-contact-note-close');

        if (isAndroid) {
            contactLink.addEventListener('click', () => {
                contactNote.hidden = false;
            });

            contactNoteClose.addEventListener('click', () => {
                contactNote.hidden = true;
            });
        }
    </script>
</body>
</html>
